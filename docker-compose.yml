services:
  mysql:
    image: mysql:5.7.44
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: scaffold
      MYSQL_USER: scaffold
      MYSQL_PASSWORD: scaffold
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  server:
    build:
      context: .
      target: server
    image: fullstack-scaffold-server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?请在 .env 或环境中设置 JWT_SECRET（≥32 字符）}
      DB_DRIVER: mysql
      DB_URL: mysql://scaffold:scaffold@mysql:3306/scaffold
      REDIS_URL: redis://redis:6379
      # 切 SQLite 示例：
      # DB_DRIVER: sqlite
      # DB_URL: /data/db.sqlite
      # 经 web 同域反代时通常不需要；若直连前端 Origin 再开启 CORS 并设置白名单
      # CORS_ORIGINS: http://localhost
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      target: web
    image: fullstack-scaffold-web
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: http://server:3000
    depends_on:
      server:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
