shellEmulator: true

packages:
  - apps/*
  - packages/*

allowBuilds:
  # swagger-ui-dist 的遥测 postinstall，明确拒绝
  '@scarf/scarf': false
  # esbuild：tsx（MikroORM CLI 加载 TS 配置）需要
  esbuild: true
  # better-sqlite3：sqlite 驱动的原生绑定
  better-sqlite3: true

catalog:
  '@mikro-orm/cli': ~7.1.15
  '@mikro-orm/migrations': ~7.1.15
  bcryptjs: ^3.0.3
  dotenv: ^17.4.2
  tsx: ^4.23.13
  zod: ^4.1.12

catalogs:
  backend:
    '@mikro-orm/core': ~7.1.14
    '@mikro-orm/nestjs': ~7.1.0
    '@mikro-orm/sqlite': ~7.1.14
    '@nestjs/cli': ~11.0.16
    '@nestjs/common': ~11.1.12
    '@nestjs/config': ^4.0.2
    '@nestjs/core': ~11.1.12
    '@nestjs/jwt': ^11.0.1
    '@nestjs/platform-express': ~11.1.12
    '@nestjs/schematics': ~11.0.9
    '@nestjs/swagger': ^11.2.0
    nestjs-pino: ^5.0.0
    nestjs-zod: ^5.5.0
    pino: ^10.0.0
    pino-http: ^11.0.0
    reflect-metadata: ^0.2.2
    rxjs: ^7.8.2
    typescript: ~5.9.3
    zod: ^4.1.12
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@types/express': ^5.0.3
    '@types/node': ^24.13.3
    eslint: ^10.10.0
    pino-pretty: ^11.3.0
    tsdown: ^0.23.0
    typescript: ~6.0.2
  frontend:
    '@antdv-next/auto-import-resolver': ^1.1.1
    '@antdv-next/icons': ^1.1.2
    '@antdv-next/tailwind': ^1.1.2
    '@tailwindcss/vite': ^4.3.3
    '@vitejs/plugin-vue': ^6.0.8
    '@vue/tsconfig': ^0.9.1
    antdv-next: ^1.5.1
    axios: ^1.7.9
    pinia: ^4.0.3
    tailwindcss: ^4.3.3
    unplugin-auto-import: ^21.1.0
    unplugin-vue-components: ^32.1.0
    vite: ^7.3.6
    vue: ^3.5.40
    vue-router: ^5.2.0
    vue-tsc: ^3.3.8
